<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKDriver - Premium Voice Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(0, 84, 166, 0.1) 0%, rgba(9, 30, 66, 0.1) 90%),
                        linear-gradient(135deg, #0A1929 0%, #1A3A5F 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, -50px); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 40px;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.25),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            max-width: 1000px;
            width: 100%;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: containerAppear 0.5s ease-out;
        }

        @keyframes containerAppear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #0A66C2, #0A4B8A);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px -5px rgba(10, 102, 194, 0.3);
        }

        .logo-icon i {
            font-size: 24px;
            color: white;
        }

        .logo-text h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #0A1929, #0A66C2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .logo-text p {
            font-size: 14px;
            color: #6B7280;
            font-weight: 400;
        }

        .status-wrapper {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .status-badge {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
        }

        .status-badge i {
            font-size: 12px;
            animation: pulse 2s infinite;
        }

        .wake-word-badge {
            background: rgba(10, 102, 194, 0.1);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            color: #0A66C2;
            border: 1px solid rgba(10, 102, 194, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .wake-word-badge i {
            color: #0A66C2;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .mic-section {
            text-align: center;
            margin: 40px 0;
            position: relative;
        }

        .mic-button {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0A66C2, #0A4B8A);
            border: none;
            cursor: pointer;
            box-shadow:
                0 20px 40px -10px rgba(10, 102, 194, 0.4),
                inset 0 -5px 5px rgba(0, 0, 0, 0.1),
                inset 0 5px 5px rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white;
            font-size: 48px;
            position: relative;
            z-index: 2;
        }

        .mic-button::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0));
            z-index: -1;
        }

        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 25px 45px -10px rgba(10, 102, 194, 0.6);
        }

        .mic-button.listening {
            background: linear-gradient(135deg, #DC2626, #B91C1C);
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7);
            }
            70% {
                box-shadow: 0 0 0 30px rgba(220, 38, 38, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0);
            }
        }

        .wave-container {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .wave-container.active {
            opacity: 1;
        }

        .wave-bar {
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #0A66C2, #0A4B8A);
            border-radius: 4px;
            animation: wave 1s ease-in-out infinite;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { height: 20px; }
            50% { height: 40px; }
        }

        .chat-section {
            background: rgba(249, 250, 251, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chat-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1F2937;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header h3 i {
            color: #0A66C2;
        }

        .chat-messages {
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(10, 102, 194, 0.3);
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 20px;
            position: relative;
            animation: messageAppear 0.3s ease-out;
            word-wrap: break-word;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background: linear-gradient(135deg, #0A66C2, #0A4B8A);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .assistant-message {
            background: white;
            color: #1F2937;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .message-time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }

        .input-section {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9CA3AF;
            font-size: 16px;
        }

        .text-input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 2px solid #E5E7EB;
            border-radius: 100px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            background: white;
        }

        .text-input:focus {
            outline: none;
            border-color: #0A66C2;
            box-shadow: 0 0 0 4px rgba(10, 102, 194, 0.1);
        }

        .send-btn {
            padding: 0 32px;
            background: linear-gradient(135deg, #0A66C2, #0A4B8A);
            color: white;
            border: none;
            border-radius: 100px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px -1px rgba(10, 102, 194, 0.2);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px -1px rgba(10, 102, 194, 0.3);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .metrics-panel {
            background: linear-gradient(135deg, #0A1929, #1A3A5F);
            border-radius: 32px;
            padding: 28px;
            color: white;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
        }

        .metrics-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .metrics-header i {
            font-size: 24px;
            color: #4F9FFF;
        }

        .metrics-header h3 {
            font-size: 18px;
            font-weight: 600;
            opacity: 0.9;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s;
        }

        .metric-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.08);
        }

        .metric-value {
            font-size: 28px;
            font-weight: 700;
            color: #4F9FFF;
            margin-bottom: 4px;
        }

        .metric-label {
            font-size: 12px;
            opacity: 0.7;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .status-message {
            text-align: center;
            margin: 10px 0;
            padding: 10px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: white;
            border-radius: 20px;
            width: fit-content;
            border-bottom-left-radius: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #9CA3AF;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 24px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .message {
                max-width: 90%;
            }
        }

        /* Premium animations */
        .glow {
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.1); }
        }

        .ripple {
            position: relative;
            overflow: hidden;
        }

        .ripple::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .ripple:active::after {
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-car"></i>
                </div>
                <div class="logo-text">
                    <h1>OKDriver</h1>
                    <p>Premium Voice Assistant</p>
                </div>
            </div>

            <div class="status-wrapper">
                <div class="status-badge">
                    <i class="fas fa-circle"></i>
                    <span>System Ready</span>
                </div>
                <div class="wake-word-badge">
                    <i class="fas fa-microphone"></i>
                    <span>Wake: "Hey OKDriver"</span>
                </div>
            </div>
        </div>

        <div class="mic-section">
            <button class="mic-button ripple" id="micButton">
                <i class="fas fa-microphone"></i>
            </button>

            <div class="wave-container" id="waveContainer">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>

            <div id="audioLevelIndicator" style="display: none;"></div>

            <div class="chat-messages" id="chatMessages">
                <div class="message assistant-message">
                    Hello! I'm your OKDriver assistant. How can I help you today?
                    <div class="message-time">
                        <i class="far fa-clock"></i> Just now
                    </div>
                </div>
            </div>

        <div class="input-section">
            <div class="input-wrapper">
                <i class="fas fa-pen"></i>
                <input type="text" class="text-input" id="textInput"
                       placeholder="Type your message in Hindi or English...">
            </div>
            <button class="send-btn ripple" id="sendBtn">
                <i class="fas fa-paper-plane"></i>
                <span>Send</span>
            </button>
        </div>

        <div class="metrics-panel">
            <div class="metrics-header">
                <i class="fas fa-chart-line"></i>
                <h3>Performance Metrics</h3>
            </div>

            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-value" id="latencyWake">0</div>
                    <div class="metric-label">
                        <i class="fas fa-clock"></i>
                        <span>Wake Word</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="latencySTT">0</div>
                    <div class="metric-label">
                        <i class="fas fa-microphone"></i>
                        <span>Speech to Text</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="latencyLLM">0</div>
                    <div class="metric-label">
                        <i class="fas fa-brain"></i>
                        <span>LLM Processing</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="latencyTTS">0</div>
                    <div class="metric-label">
                        <i class="fas fa-volume-up"></i>
                        <span>Text to Speech</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="latencyTotal">0</div>
                    <div class="metric-label">
                        <i class="fas fa-hourglass"></i>
                        <span>Total</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CSRF Token -->
    {% csrf_token %}

    <script>
class VoiceAssistant {
    constructor() {
        this.mediaRecorder = null;
        this.audioChunks = [];
        this.isListening = false;
        this.stream = null;
        this.recordingTimeout = null;
        this.audioContext = null;
        this.init();
    }

    async init() {
        this.setupEventListeners();
        this.startLatencyPolling();
        await this.checkMicrophonePermission();
        this.addWelcomeMessage();
    }

    setupEventListeners() {
        document.getElementById('micButton').addEventListener('click', () => this.toggleListening());
        document.getElementById('sendBtn').addEventListener('click', () => this.sendTextMessage());
        document.getElementById('textInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') this.sendTextMessage();
        });
    }

    async checkMicrophonePermission() {
        try {
            const permissionStatus = await navigator.permissions.query({ name: 'microphone' });
            if (permissionStatus.state === 'denied') {
                this.showStatus('⚠️ Microphone access denied', 'error');
            }
        } catch (error) {
            console.log('Permission API not supported');
        }
    }

    addWelcomeMessage() {
        this.addMessage(
            '🚗 नमस्ते! मैं आपका OKDriver सहायक हूँ। आप हिंदी या अंग्रेजी में बोल सकते हैं।<br>' +
            '<span style="font-size: 12px;">Hello! I\'m your OKDriver assistant. You can speak in Hindi or English.</span>',
            'assistant'
        );
    }

    async toggleListening() {
        if (!this.isListening) {
            await this.startListening();
        } else {
            this.stopListening();
        }
    }

    // Record audio and convert to WAV format in browser
    async startListening() {
        try {
            // Set up audio context for recording
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)({
                sampleRate: 16000
            });

            this.stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    channelCount: 1,
                    sampleRate: 16000,
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });

            // Create media stream source
            const source = this.audioContext.createMediaStreamSource(this.stream);

            // Create script processor for raw audio capture
            const scriptProcessor = this.audioContext.createScriptProcessor(4096, 1, 1);

            source.connect(scriptProcessor);
            scriptProcessor.connect(this.audioContext.destination);

            this.audioChunks = [];
            this.recordingStartTime = Date.now();

            scriptProcessor.onaudioprocess = (e) => {
                if (!this.isListening) return;

                // Get raw audio data
                const inputData = e.inputBuffer.getChannelData(0);

                // Convert Float32 to Int16
                const int16Data = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    const s = Math.max(-1, Math.min(1, inputData[i]));
                    int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }

                // Store the audio chunk
                this.audioChunks.push(int16Data);
            };

            this.isListening = true;

            // Update UI
            document.getElementById('micButton').classList.add('listening');
            document.getElementById('waveContainer').classList.add('active');

            this.showStatus('🎤 Recording... Click mic to stop', 'info');

            // Auto-stop after 5 seconds
            this.recordingTimeout = setTimeout(() => {
                if (this.isListening) this.stopListening();
            }, 5000);

        } catch (error) {
            console.error('Microphone error:', error);
            this.showStatus('❌ Could not access microphone', 'error');
        }
    }

    stopListening() {
        if (this.isListening) {
            this.isListening = false;

            // Clean up audio context and stream
            if (this.audioContext) {
                this.audioContext.close();
            }

            if (this.stream) {
                this.stream.getTracks().forEach(track => track.stop());
            }

            if (this.recordingTimeout) {
                clearTimeout(this.recordingTimeout);
            }

            // Update UI
            document.getElementById('micButton').classList.remove('listening');
            document.getElementById('waveContainer').classList.remove('active');

            this.showStatus('⏳ Processing...', 'info');

            // Process the recorded audio
            this.processWAVRecording();
        }
    }

    processWAVRecording() {
        if (this.audioChunks.length === 0) {
            this.showStatus('❌ No audio recorded', 'error');
            return;
        }

        try {
            // Concatenate all chunks
            const totalLength = this.audioChunks.reduce((acc, chunk) => acc + chunk.length, 0);
            const combinedData = new Int16Array(totalLength);

            let offset = 0;
            for (const chunk of this.audioChunks) {
                combinedData.set(chunk, offset);
                offset += chunk.length;
            }

            // Create WAV file
            const wavBlob = this.createWAVBlob(combinedData, 16000);

            // Convert to base64 and send
            const reader = new FileReader();
            reader.readAsDataURL(wavBlob);

            reader.onloadend = () => {
                const base64Audio = reader.result.split(',')[1];
                this.sendAudioToServer(base64Audio);
            };

        } catch (error) {
            console.error('Error processing WAV:', error);
            this.showStatus('❌ Error processing audio', 'error');
        }
    }

    createWAVBlob(audioData, sampleRate) {
        // Create WAV header
        const bitsPerSample = 16;
        const channels = 1;
        const byteRate = sampleRate * channels * bitsPerSample / 8;
        const blockAlign = channels * bitsPerSample / 8;
        const dataSize = audioData.length * 2; // 16-bit = 2 bytes per sample

        const buffer = new ArrayBuffer(44 + dataSize);
        const view = new DataView(buffer);

        // RIFF chunk
        this.writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + dataSize, true);
        this.writeString(view, 8, 'WAVE');

        // fmt subchunk
        this.writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true); // fmt chunk size
        view.setUint16(20, 1, true); // audio format (PCM)
        view.setUint16(22, channels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, bitsPerSample, true);

        // data subchunk
        this.writeString(view, 36, 'data');
        view.setUint32(40, dataSize, true);

        // Write audio data
        const dataView = new Int16Array(buffer, 44, audioData.length);
        dataView.set(audioData);

        return new Blob([buffer], { type: 'audio/wav' });
    }

    writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
        }
    }

    async sendAudioToServer(base64Audio) {
        try {
            const response = await fetch('/api/process-audio/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': this.getCSRFToken()
                },
                body: JSON.stringify({ audio: base64Audio })
            });

            const data = await response.json();

            if (data.text) {
                this.addMessage(data.text, 'user');
            } else {
                this.addMessage("I didn't catch that. Could you please speak again?", 'assistant');
            }

            if (data.response) {
                this.addMessage(data.response, 'assistant');

                if (data.audio) {
                    await this.playAudio(data.audio);
                }
            }

            if (data.latency) {
                this.updateLatency(data.latency);
            }

            this.showStatus('✅ Ready', 'success');

        } catch (error) {
            console.error('Error sending audio:', error);
            this.showStatus('❌ Error sending audio', 'error');
        }
    }

    async sendTextMessage() {
        const input = document.getElementById('textInput');
        const message = input.value.trim();

        if (!message) return;

        input.value = '';
        this.addMessage(message, 'user');
        this.showTypingIndicator();

        try {
            const response = await fetch('/api/process-command/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': this.getCSRFToken()
                },
                body: JSON.stringify({ command: message })
            });

            const data = await response.json();
            this.removeTypingIndicator();

            if (data.success) {
                this.addMessage(data.response, 'assistant');

                if (data.audio) {
                    await this.playAudio(data.audio);
                }

                if (data.latency) {
                    this.updateLatency(data.latency);
                }
            }

        } catch (error) {
            console.error('Error sending message:', error);
            this.removeTypingIndicator();
            this.addMessage('Network error. Please try again.', 'assistant');
        }
    }

    showTypingIndicator() {
        const container = document.getElementById('chatMessages');
        const indicator = document.createElement('div');
        indicator.className = 'typing-indicator';
        indicator.id = 'typingIndicator';
        indicator.innerHTML = `
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        `;
        container.appendChild(indicator);
        container.scrollTop = container.scrollHeight;
    }

    removeTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) {
            indicator.remove();
        }
    }

    addMessage(text, sender) {
        const container = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender === 'user' ? 'user-message' : 'assistant-message'}`;

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        messageDiv.innerHTML = `
            ${text}
            <div class="message-time">
                <i class="far fa-clock"></i> ${timeStr}
            </div>
        `;

        container.appendChild(messageDiv);
        container.scrollTop = container.scrollHeight;
    }

    async playAudio(base64Audio) {
        try {
            const audio = new Audio('data:audio/mp3;base64,' + base64Audio);
            await audio.play();
        } catch (error) {
            console.error('Audio playback error:', error);
        }
    }

    showStatus(message, type = 'info') {
        let statusEl = document.getElementById('statusMessage');

        if (!statusEl) {
            statusEl = document.createElement('div');
            statusEl.id = 'statusMessage';
            statusEl.className = 'status-message';
            document.querySelector('.mic-section').appendChild(statusEl);
        }

        const colors = {
            'info': { bg: '#EFF6FF', text: '#1E40AF' },
            'success': { bg: '#ECFDF3', text: '#065F46' },
            'error': { bg: '#FEF2F2', text: '#991B1B' }
        };

        const color = colors[type] || colors.info;

        statusEl.style.cssText = `
            background: ${color.bg};
            color: ${color.text};
            padding: 12px 20px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            margin-top: 15px;
            display: inline-block;
            animation: fadeIn 0.3s;
        `;

        statusEl.innerHTML = message;

        setTimeout(() => {
            if (statusEl.parentNode) {
                statusEl.remove();
            }
        }, 3000);
    }

    updateLatency(latency) {
        if (!latency) return;

        const elements = {
            'latencyWake': latency.wake_word_detection || 0,
            'latencySTT': latency.speech_to_text || 0,
            'latencyLLM': latency.llm_processing || 0,
            'latencyTTS': latency.text_to_speech || 0,
            'latencyTotal': latency.total || 0
        };

        for (const [id, value] of Object.entries(elements)) {
            const element = document.getElementById(id);
            if (element) {
                element.textContent = Math.round(value);
            }
        }
    }

    async startLatencyPolling() {
        setInterval(async () => {
            try {
                const response = await fetch('/api/latency/');
                const data = await response.json();
                this.updateLatency(data);
            } catch (error) {
                console.error('Error fetching latency:', error);
            }
        }, 2000);
    }

    getCSRFToken() {
        return document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
    }
}

// Initialize assistant
document.addEventListener('DOMContentLoaded', () => {
    window.assistant = new VoiceAssistant();
});
    </script>
